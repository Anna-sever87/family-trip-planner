services:
  web:
    build: .
    image: family-trip-planner:local
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${REMINDER_TZ:-Asia/Novosibirsk}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - planner-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    image: family-trip-planner:local
    command: ["python", "/app/bot.py"]
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${REMINDER_TZ:-Asia/Novosibirsk}
    volumes:
      - planner-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  planner-data:
